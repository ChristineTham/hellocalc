<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.MODELS = this.buildModels();
    this.state = {
      model:'HP-12C', mode:'rpn', theme:'dark', katexReady:!!(typeof window!=='undefined'&&window.katex),
      calc: this.seed(),
      nInput:'', nHist:[{expr:'sqrt(144) + 3', latex:'\\sqrt{144}+3 = 15', val:15}],
    };
  }
  componentDidMount(){
    if(!this.state.katexReady){ const t=setInterval(()=>{ if(window.katex){clearInterval(t);this.setState({katexReady:true});} },120); setTimeout(()=>clearInterval(t),8000); }
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>this.forceUpdate());
  }
  seed(){ return { T:0,Z:0,Y:1500,X:12, lastX:144, entry:null, lift:true, prefix:'none', beg:false, dec:2, ang:'DEG',
    hist:[{op:'1500',v:'1,500.00'},{op:'ENTER',v:'1,500.00'},{op:'g √x',v:'12.00'}], latex:'\\sqrt{144}=12',
    reg:{n:'',i:'',PV:'',PMT:'',FV:''}, tvm:{n:0,i:0,PV:0,PMT:0,FV:0}, rpl:[1500,12], err:'' }; }
  // ================= design tokens: vintage, light + dark ramps =================
  tokens(){
    const dark = {
      appBg:'#141310', chrome:'#201e19', chromeBd:'#2f2c25', text:'#ded9cc', muted:'#8f8977', faint:'#66614f',
      bezel:'#33322e', bezelBd:'#48463f', bezelInner:'#3b3934',
      disp:'#aeb79c', dispBd:'#8a927a', ink:'#1b2016', dim:'#5c6350',
      glow:'inset 0 1px 0 rgba(255,255,255,.22), inset 0 -10px 20px rgba(0,0,0,.14)',
      key:'#2b2a27', keyBd:'#141310', keyTx:'#ece7db', keySh:'0 2px 0 #100f0d, 0 3px 5px rgba(0,0,0,.45)',
      op:'#38362f', opTx:'#f0d9a4', enter:'#3d3b34', enterTx:'#ece7db',
      gold:'#d3a441', blue:'#5b8fd6', on:'#e08a7a',
      panel:'#1b1a16', panelBd:'#2c2a23', shadow:'0 24px 60px rgba(0,0,0,.5)',
    };
    const light = {
      appBg:'#e6e3da', chrome:'#f3f0e8', chromeBd:'#dcd8cc', text:'#2a2823', muted:'#7d7869', faint:'#a6a08e',
      bezel:'#cdcabf', bezelBd:'#b4b1a4', bezelInner:'#d5d2c7',
      disp:'#c1cbaa', dispBd:'#a3ab8c', ink:'#222a1a', dim:'#6b7256',
      glow:'inset 0 1px 0 rgba(255,255,255,.5), inset 0 -8px 16px rgba(90,95,70,.1)',
      key:'#e9e6dc', keyBd:'#c6c2b5', keyTx:'#2a2823', keySh:'0 2px 0 #c2beb0, 0 3px 4px rgba(80,72,50,.16)',
      op:'#ddd9cd', opTx:'#8a5a20', enter:'#2b2a27', enterTx:'#ece7db',
      gold:'#a9832f', blue:'#35619e', on:'#b23b2f',
      panel:'#efece3', panelBd:'#dcd8cc', shadow:'0 18px 44px rgba(70,62,40,.14)',
    };
    return this.state.theme==='dark'?dark:light;
  }
  // ================= model keyboards (source: hp/layouts) =================
  buildModels(){
    const mk = (rows)=>{ const keys=[]; rows.forEach((row,r)=>{ row.forEach((cell,cix)=>{ if(cell===null) return; const [primary,f,g]=cell; const col=cix+1, rowN=r+1;
      let kind='std'; if('0123456789'.includes(primary)) kind='digit'; else if(primary==='•'||primary==='.') kind='digit'; else if('+−×÷'.includes(primary)) kind='arith'; else if(primary==='ENTER') kind='enter'; else if(primary==='f') kind='pf'; else if(primary==='g') kind='pg'; else if(primary==='ON') kind='on';
      const rowSpan = primary==='ENTER'?2:1;
      keys.push({primary,f:f||'',g:g||'',col,row:rowN,kind,rowSpan}); }); }); return keys; };
    const HP12C = mk([
      [['n','AMORT','12×'],['i','INT','12÷'],['PV','NPV','CFo'],['PMT','RND','CFj'],['FV','IRR','Nj'],['CHS','','DATE'],['7','','BEG'],['8','','END'],['9','','MEM'],['÷','','']],
      [['yˣ','PRICE','√x'],['1/x','YTM','eˣ'],['%T','SL','LN'],['Δ%','SOYD','FRAC'],['%','DB','INTG'],['EEX','','ΔDYS'],['4','',''],['5','',''],['6','',''],['×','','']],
      [['R/S','P/R','PSE'],['SST','Σ','BST'],['R↓','PRGM','GTO'],['x⇄y','FIN','x≤y'],['CLx','REG','x=0'],['ENTER','PREFIX','LSTx'],['1','','x̂,r'],['2','','ŷ,r'],['3','','n!'],['−','','']],
      [['ON','',''],['f','',''],['g','',''],['STO','',''],['RCL','',''],null,['0','','x̄'],['•','','s'],['Σ+','','Σ−'],['+','','']],
    ]);
    const HP15C = mk([
      [['√x','A','x²'],['eˣ','B','LN'],['10ˣ','C','LOG'],['yˣ','D','%'],['1/x','E','Δ%'],['CHS','MATRIX','ABS'],['7','FIX','DEG'],['8','SCI','RAD'],['9','ENG','GRD'],['÷','SOLVE','x≤y']],
      [['SST','LBL','BST'],['GTO','HYP','HYP⁻¹'],['SIN','DIM','SIN⁻¹'],['COS','(i)','COS⁻¹'],['TAN','I','TAN⁻¹'],['EEX','RESULT','π'],['4','x≷','SF'],['5','DSE','CF'],['6','ISG','F?'],['×','∫','x=0']],
      [['R/S','PSE','P/R'],['GSB','CLΣ','RTN'],['R↓','CLPRGM','R↑'],['x⇄y','CLREG','RND'],['←','CLPREF','CLx'],['ENTER','RAN#','LSTx'],['1','→R','→P'],['2','→H.MS','→H'],['3','→RAD','→DEG'],['−','Re⇄Im','TEST']],
      [['ON','',''],['f','',''],['g','',''],['STO','FRAC','INT'],['RCL','USER','MEM'],null,['0','x!','x̄'],['•','ŷ,r','s'],['Σ+','L.R.','Σ−'],['+','Py,x','Cy,x']],
    ]);
    return { 'HP-35':this.make35(), 'HP-12C':{keys:HP12C, sub:'RPN · FINANCIAL', angle:false, family:'voyager'}, 'HP-15C':{keys:HP15C, sub:'RPN · SCIENTIFIC', angle:true, family:'voyager'}, 'HP-48G':this.make48G() };
  }
  // ================= number format =================
  fmt(n,dec){ if(n===''||n==null||isNaN(n)||!isFinite(n)) return isFinite(n)?'0.00':'Error'; const d=dec==null?2:dec; const neg=n<0; let s=Math.abs(n).toFixed(d); let [ip,fp]=s.split('.'); ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,','); return (neg?'-':'')+ip+(fp?'.'+fp:''); }
  tex(n){ if(n==null||isNaN(n)) return '0'; return this.fmt(n,2).replace(/,/g,'{,}'); }
  escTex(s){ return String(s).replace(/([%&#_{}])/g,'\\$1'); }
  toRad(x,ang){ return ang==='RAD'?x: ang==='GRD'? x*Math.PI/200 : x*Math.PI/180; }
  fromRad(x,ang){ return ang==='RAD'?x: ang==='GRD'? x*200/Math.PI : x*180/Math.PI; }
  fact(x){ if(x<0||x!==Math.floor(x)||x>170) return NaN; let r=1; for(let k=2;k<=x;k++) r*=k; return r; }
  // ================= RPN engine =================
  press(key){
    const fam=this.MODELS[this.state.model].family; if(fam==='rpl') return this.pressRpl(key); if(fam==='classic') return this.press35(key);
    const c={...this.state.calc, reg:{...this.state.calc.reg}, hist:this.state.calc.hist.slice()};
    const p=key.primary;
    if(p==='f'){ c.prefix=c.prefix==='f'?'none':'f'; this.setState({calc:c}); return; }
    if(p==='g'){ c.prefix=c.prefix==='g'?'none':'g'; this.setState({calc:c}); return; }
    if(p==='ON'){ const s=this.seed(); s.T=0;s.Z=0;s.Y=0;s.X=0;s.lastX=0;s.hist=[];s.latex='';s.reg={n:'',i:'',PV:'',PMT:'',FV:''}; this.setState({calc:s}); return; }
    const pref=c.prefix; c.prefix='none'; c.err='';
    const func = pref==='f'? key.f : pref==='g'? key.g : p;
    if((pref==='f'||pref==='g') && !func){ this.setState({calc:c}); return; }
    this.exec(c, func); this.setState({calc:c});
  }
  pushLift(c){ c.T=c.Z; c.Z=c.Y; c.Y=c.X; }
  drop(c){ c.X=c.Y; c.Y=c.Z; c.Z=c.T; }
  logHist(c,op,val){ c.hist=[...c.hist,{op,v:this.fmt(val,c.dec)}].slice(-40); }
  finishEntry(c){ if(c.entry!=null){ c.X=parseFloat(c.entry)||0; c.entry=null; } }
  exec(c,func){
    const wasEntry=c.entry!=null;
    const digit='0123456789'.includes(func)?func:null;
    if(digit!=null && func.length===1 && !c._shift){ if(c.entry==null){ if(c.lift) this.pushLift(c); c.entry=''; c.lift=false; } c.entry=(c.entry==='0'?'':c.entry)+digit; c.X=parseFloat(c.entry)||0; return; }
    if(func==='•'||func==='.'){ if(c.entry==null){ if(c.lift) this.pushLift(c); c.entry='0'; c.lift=false; } if(!c.entry.includes('.')) c.entry+='.'; return; }
    if(func==='CHS'){ if(c.entry!=null){ c.entry=c.entry.startsWith('-')?c.entry.slice(1):'-'+c.entry; c.X=parseFloat(c.entry)||0; } else { c.X=-c.X; } return; }
    this.finishEntry(c);
    const U=(fn,ltx)=>{ c.lastX=c.X; const r=fn(c.X); c.X=r; c.lift=true; c.latex=ltx(c.lastX,r); this.logHist(c,func,r); };
    const B=(fn,sym)=>{ const y=c.Y,x=c.X; c.lastX=x; const r=fn(y,x); this.drop(c); c.X=r; c.lift=true; c.latex=`${this.tex(y)} ${sym} ${this.tex(x)} = ${this.tex(r)}`; this.logHist(c,func,r); };
    switch(func){
      case 'ENTER': this.pushLift(c); c.lift=false; this.logHist(c,'ENTER',c.X); return;
      case '+': B((a,b)=>a+b,'+'); return;
      case '−': B((a,b)=>a-b,'-'); return;
      case '×': B((a,b)=>a*b,'\\times'); return;
      case '÷': B((a,b)=>{ if(b===0){c.err='÷0';return 0;} return a/b; },'\\div'); return;
      case 'yˣ': { const y=c.Y,x=c.X; c.lastX=x; const r=Math.pow(y,x); this.drop(c); c.X=r; c.lift=true; c.latex=`${this.tex(y)}^{${this.tex(x)}} = ${this.tex(r)}`; this.logHist(c,'yˣ',r); return; }
      case '√x': U(x=>Math.sqrt(x),(a,r)=>`\\sqrt{${this.tex(a)}} = ${this.tex(r)}`); return;
      case 'x²': U(x=>x*x,(a,r)=>`${this.tex(a)}^2 = ${this.tex(r)}`); return;
      case '1/x': U(x=>x===0?(c.err='÷0',0):1/x,(a,r)=>`\\frac{1}{${this.tex(a)}} = ${this.tex(r)}`); return;
      case 'LN': U(x=>Math.log(x),(a,r)=>`\\ln(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'LOG': U(x=>Math.log10(x),(a,r)=>`\\log(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'eˣ': U(x=>Math.exp(x),(a,r)=>`e^{${this.tex(a)}} = ${this.tex(r)}`); return;
      case '10ˣ': U(x=>Math.pow(10,x),(a,r)=>`10^{${this.tex(a)}} = ${this.tex(r)}`); return;
      case 'SIN': U(x=>Math.sin(this.toRad(x,c.ang)),(a,r)=>`\\sin(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'COS': U(x=>Math.cos(this.toRad(x,c.ang)),(a,r)=>`\\cos(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'TAN': U(x=>Math.tan(this.toRad(x,c.ang)),(a,r)=>`\\tan(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'SIN⁻¹': U(x=>this.fromRad(Math.asin(x),c.ang),(a,r)=>`\\sin^{-1}(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'COS⁻¹': U(x=>this.fromRad(Math.acos(x),c.ang),(a,r)=>`\\cos^{-1}(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'TAN⁻¹': U(x=>this.fromRad(Math.atan(x),c.ang),(a,r)=>`\\tan^{-1}(${this.tex(a)}) = ${this.tex(r)}`); return;
      case 'π': this.pushLift(c); c.X=Math.PI; c.lift=true; c.latex='\\pi = '+this.tex(Math.PI); this.logHist(c,'π',Math.PI); return;
      case 'x!': case 'n!': U(x=>this.fact(x),(a,r)=>`${this.tex(a)}! = ${this.tex(r)}`); return;
      case '%': { const y=c.Y,x=c.X; c.lastX=x; const r=y*x/100; c.X=r; c.lift=true; c.latex=`${this.tex(y)}\\times\\frac{${this.tex(x)}}{100} = ${this.tex(r)}`; this.logHist(c,'%',r); return; }
      case '%T': { const y=c.Y,x=c.X; c.lastX=x; const r=y===0?0:x/y*100; c.X=r; c.lift=true; c.latex=`\\%T = ${this.tex(r)}`; this.logHist(c,'%T',r); return; }
      case 'Δ%': { const y=c.Y,x=c.X; c.lastX=x; const r=y===0?0:(x-y)/y*100; c.X=r; c.lift=true; c.latex=`\\Delta\\% = ${this.tex(r)}`; this.logHist(c,'Δ%',r); return; }
      case 'ABS': U(x=>Math.abs(x),(a,r)=>`|${this.tex(a)}| = ${this.tex(r)}`); return;
      case 'FRAC': U(x=>x-Math.trunc(x),(a,r)=>`\\mathrm{FRAC} = ${this.tex(r)}`); return;
      case 'INTG': case 'INT': U(x=>Math.trunc(x),(a,r)=>`\\mathrm{INT} = ${this.tex(r)}`); return;
      case 'CHS': if(c.entry!=null){ c.entry=c.entry.startsWith('-')?c.entry.slice(1):'-'+c.entry; c.X=parseFloat(c.entry)||0; } else c.X=-c.X; return;
      case 'CLx': c.X=0; c.entry=null; c.lift=false; return;
      case 'CLR': c.T=0; c.Z=0; c.Y=0; c.X=0; c.entry=null; c.lift=false; c.latex=''; return;
      case '←': if(c.entry!=null&&c.entry.length>1){ c.entry=c.entry.slice(0,-1); c.X=parseFloat(c.entry)||0; } else { c.entry=null; c.X=0; c.lift=false; } return;
      case 'x⇄y': case 'x≷y': { const t=c.X; c.X=c.Y; c.Y=t; c.lift=true; return; }
      case 'R↓': { const t=c.X; c.X=c.Y; c.Y=c.Z; c.Z=c.T; c.T=t; c.lift=true; return; }
      case 'R↑': { const t=c.T; c.T=c.Z; c.Z=c.Y; c.Y=c.X; c.X=t; c.lift=true; return; }
      case 'LSTx': this.pushLift(c); c.X=c.lastX; c.lift=true; return;
      case 'DEG': c.ang='DEG'; return; case 'RAD': c.ang='RAD'; return; case 'GRD': c.ang='GRD'; return;
      case 'BEG': c.beg=true; return; case 'END': c.beg=false; return;
      case 'n': case 'i': case 'PV': case 'PMT': case 'FV': this.tvmKey(c,func,wasEntry); return;
      case 'STO': case 'RCL': c.lift=true; return;
      default: c.lift=true; c.latex=`\\text{${this.escTex(func)}}`; return;
    }
  }
  // ================= native-mode expression evaluator (safe recursive descent) =================
  evalExpr(src){
    const s=src.replace(/\s+/g,''); if(!s) throw new Error('empty');
    let i=0; const fns={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,sin:x=>Math.sin(x),cos:x=>Math.cos(x),tan:x=>Math.tan(x),exp:Math.exp,abs:Math.abs,asin:Math.asin,acos:Math.acos,atan:Math.atan};
    const peek=()=>s[i];
    const num=()=>{ let j=i; while(/[0-9.]/.test(s[i])) i++; if(i===j) throw new Error('num'); return parseFloat(s.slice(j,i)); };
    const factor=()=>{ if(peek()==='('){ i++; const v=expr(); if(peek()!==')') throw new Error(')'); i++; return v; }
      if(peek()==='-'){ i++; return -factor(); } if(peek()==='+'){ i++; return factor(); }
      if(/[a-z]/i.test(peek())){ let j=i; while(/[a-z]/i.test(s[i])) i++; const id=s.slice(j,i); if(id==='pi') return Math.PI; if(id==='e') return Math.E; const fn=fns[id]; if(!fn) throw new Error('fn '+id); if(peek()!=='(') throw new Error('('); i++; const a=expr(); if(peek()!==')') throw new Error(')'); i++; return fn(a); }
      return num(); };
    const power=()=>{ let a=factor(); if(peek()==='^'){ i++; return Math.pow(a,power()); } return a; };
    const term=()=>{ let a=power(); while(peek()==='*'||peek()==='/'||peek()==='×'||peek()==='÷'){ const op=s[i++]; const b=power(); a=(op==='*'||op==='×')?a*b:a/b; } return a; };
    const expr=()=>{ let a=term(); while(peek()==='+'||peek()==='-'||peek()==='−'){ const op=s[i++]; const b=term(); a=(op==='+')?a+b:a-b; } return a; };
    const v=expr(); if(i<s.length) throw new Error('trailing'); return v;
  }
  toLatex(src){ return src.replace(/\*/g,'\\times ').replace(/sqrt\(([^()]*)\)/g,'\\sqrt{$1}').replace(/pi/g,'\\pi ').replace(/\^/g,'^'); }
  runNative(){
    const src=this.state.nInput.trim(); if(!src) return;
    let val, latex;
    try{ val=this.evalExpr(src); latex=`${this.toLatex(src)} = ${this.fmt(val,4).replace(/,/g,'{,}')}`; }
    catch(e){ latex=`\\text{${this.escTex(src)}}\\;\\Rightarrow\\;\\mathrm{Error}`; val=null; }
    const nHist=[...this.state.nHist,{expr:src,latex,val}].slice(-40);
    // push result onto shared stack (state retained across modes)
    const c={...this.state.calc}; if(val!=null&&isFinite(val)){ this.pushLift(c); c.X=val; c.lift=true; c.latex=latex; }
    this.setState({nHist, nInput:'', calc:c});
  }
  // ================= rendering =================
  renderLatex(tex,color,size){ const h=React.createElement;
    if(this.state.katexReady&&window.katex){ let html; try{ html=window.katex.renderToString(tex||'',{throwOnError:false,displayMode:true}); }catch(e){ html='<span>'+(tex||'')+'</span>'; } return h('span',{style:{color,fontSize:size},dangerouslySetInnerHTML:{__html:html}}); }
    return h('span',{style:{color,fontFamily:'IBM Plex Mono, monospace',fontSize:size}},(tex||'').replace(/\\/g,'')); }
  renderKey(t,c,k){ const h=React.createElement; const active=c.prefix; const isPf=k.primary==='f', isPg=k.primary==='g';
    let face=t.key, tx=t.keyTx, sh=t.keySh;
    if(k.kind==='arith'){ face=t.op; tx=t.opTx; } if(k.kind==='enter'){ face=t.enter; tx=t.enterTx; }
    if(isPf){ face=t.gold; tx='#231a05'; } if(isPg){ face=t.blue; tx='#ffffff'; } if(k.kind==='on'){ tx=t.on; }
    const fHot=active==='f'&&k.f, gHot=active==='g'&&k.g;
    const legF=k.f?h('span',{style:{position:'absolute',top:'4px',left:'1px',right:'1px',textAlign:'center',fontSize:k.f.length>4?'7px':'8.5px',fontWeight:700,lineHeight:1,color:t.gold,fontFamily:'Barlow Semi Condensed,sans-serif',opacity:fHot?1:.9,transform:fHot?'translateY(-1px)':'none',textShadow:fHot?`0 0 7px ${t.gold}`:'none',transition:'all .1s',letterSpacing:'.01em'}},k.f):null;
    const legG=k.g?h('span',{style:{position:'absolute',bottom:'3px',left:'1px',right:'1px',textAlign:'center',fontSize:k.g.length>4?'7px':'8.5px',fontWeight:700,lineHeight:1,color:t.blue,fontFamily:'Barlow Semi Condensed,sans-serif',opacity:gHot?1:.88,transform:gHot?'translateY(1px)':'none',textShadow:gHot?`0 0 7px ${t.blue}`:'none',transition:'all .1s'}},k.g):null;
    const psz=k.primary.length>3?'11px':(k.primary.length>2?'12.5px':'15px');
